[filters.xcodebuild]
description = "Compact xcodebuild output — strip build phases, keep errors/warnings/summary"
match_command = "^xcodebuild\\b"
strip_ansi = true
strip_lines_matching = [
  "^\\s*$",
  "^Command line invocation:",
  "^Build settings from command line:",
  "^    SDKROOT\\s*=",
  "^Resolve Package Graph$",
  "^Resolved source packages:$",
  "^  [A-Za-z0-9_.-]+:\\s+https?://",
  "^Compute",
  "^Prepare packages$",
  "^CreateBuildRequest$",
  "^SendProjectDescription$",
  "^CreateBuildOperation$",
  "^GatherProvisioningInputs",
  "^ExecuteExternalTool",
  "^note: Using new build system",
  "^note: Building targets",
  "^note: Target dependency graph",
  "^    Target '",
  "^        \\u279C\\s",
  "^    \\(no dependencies\\)$",
  "^CompileC\\s",
  "^CompileSwift\\s",
  "^SwiftDriver\\s",
  "^SwiftEmitModule\\s",
  "^SwiftCompile\\s",
  "^Ld\\s",
  "^CreateBuildDirectory\\s",
  "^MkDir\\s",
  "^ProcessInfoPlistFile\\s",
  "^CopySwiftLibs\\s",
  "^CodeSign\\s",
  "^Signing Identity:",
  "^RegisterWithLaunchServices",
  "^Validate\\s",
  "^ProcessProductPackaging\\s",
  "^ProcessProductPackagingDER\\s",
  "^Touch\\s",
  "^LinkStoryboards",
  "^CompileStoryboard",
  "^CompileAssetCatalog",
  "^CompileXCStrings\\s",
  "^GenerateDSYMFile",
  "^GenerateAssetSymbols\\s",
  "^ExtractAppIntentsMetadata\\s",
  "^PhaseScriptExecution",
  "^PBXCp\\s",
  "^SetMode\\s",
  "^SetOwnerAndGroup\\s",
  "^Ditto\\s",
  "^CpResource\\s",
  "^CpHeader\\s",
  "^Copy\\s",
  "^CopyStringsFile\\s",
  "^\\s+Entitlements:\\s*$",
  "^\\s+cd\\s+/",
  "^\\s+export\\s",
  "^\\s+/Applications/Xcode",
  "^\\s+/usr/bin/",
  "^\\s+builtin-",
]
# After line-stripping, keep a short prefix (command context) and a long tail
# (Swift diagnostics, XCTest results, ** BUILD ** lines) so max_lines alone
# cannot cut off trailing errors on large logs.
head_lines = 14
tail_lines = 90
max_lines = 120
on_empty = "xcodebuild: ok"

[[tests.xcodebuild]]
name = "strips build phases, keeps errors and summary"
input = """
note: Using new build system
CompileSwift normal arm64 /Users/dev/App/ViewController.swift
    cd /Users/dev/App
    /Applications/Xcode.app/Contents/Developer/Toolchains/XcodeDefault.xctoolchain/usr/bin/swift-frontend -c
CompileSwift normal arm64 /Users/dev/App/AppDelegate.swift
    cd /Users/dev/App
    export DEVELOPER_DIR=/Applications/Xcode.app/Contents/Developer
Ld /Users/dev/Build/Products/Debug/App normal arm64
    cd /Users/dev/App
    /Applications/Xcode.app/Contents/Developer/Toolchains/XcodeDefault.xctoolchain/usr/bin/clang
CodeSign /Users/dev/Build/Products/Debug/App.app
    cd /Users/dev/App
    builtin-codesign --force --sign

/Users/dev/App/ViewController.swift:42:9: error: use of unresolved identifier 'foo'
/Users/dev/App/Model.swift:18:5: warning: variable 'x' was never used

** BUILD FAILED **
"""
expected = "/Users/dev/App/ViewController.swift:42:9: error: use of unresolved identifier 'foo'\n/Users/dev/App/Model.swift:18:5: warning: variable 'x' was never used\n** BUILD FAILED **"

[[tests.xcodebuild]]
name = "clean build success"
input = """
note: Using new build system
CompileSwift normal arm64 /Users/dev/App/Main.swift
    cd /Users/dev/App
Ld /Users/dev/Build/Products/Debug/App normal arm64
    cd /Users/dev/App
CodeSign /Users/dev/Build/Products/Debug/App.app
    cd /Users/dev/App
    builtin-codesign --force --sign

** BUILD SUCCEEDED **
"""
expected = "** BUILD SUCCEEDED **"

[[tests.xcodebuild]]
name = "test output keeps test results"
input = """
note: Using new build system
CompileSwift normal arm64 /Users/dev/AppTests/Tests.swift
    cd /Users/dev/App
Test Suite 'All tests' started at 2026-03-10 12:00:00
Test Suite 'AppTests' started at 2026-03-10 12:00:00
Test Case '-[AppTests testExample]' passed (0.001 seconds).
Test Case '-[AppTests testFailing]' failed (0.002 seconds).
Test Suite 'AppTests' passed at 2026-03-10 12:00:01
Executed 2 tests, with 1 failure in 0.003 seconds
"""
expected = "Test Suite 'All tests' started at 2026-03-10 12:00:00\nTest Suite 'AppTests' started at 2026-03-10 12:00:00\nTest Case '-[AppTests testExample]' passed (0.001 seconds).\nTest Case '-[AppTests testFailing]' failed (0.002 seconds).\nTest Suite 'AppTests' passed at 2026-03-10 12:00:01\nExecuted 2 tests, with 1 failure in 0.003 seconds"

[[tests.xcodebuild]]
name = "xcodebuild test keeps runner summary without compile noise"
input = """
note: Using new build system
Testing started on 2026-05-11 at 12:00:00.000
Test Suite 'PassMakerTests' started at 2026-05-11 12:00:00.001
Test Case '-[PassMakerTests test_onboarding]' passed (0.012 seconds).
Executed 1 test, with 0 failures (0 unexpected) in 0.015 (0.015) seconds
"""
expected = "Testing started on 2026-05-11 at 12:00:00.000\nTest Suite 'PassMakerTests' started at 2026-05-11 12:00:00.001\nTest Case '-[PassMakerTests test_onboarding]' passed (0.012 seconds).\nExecuted 1 test, with 0 failures (0 unexpected) in 0.015 (0.015) seconds"

[[tests.xcodebuild]]
name = "spm graph and swiftdriver noise stripped, diagnostics kept"
input = """
Command line invocation:
    /Applications/Xcode.app/Contents/Developer/usr/bin/xcodebuild -scheme App build

Resolve Package Graph

Resolved source packages:
  FooKit: https://github.com/example/FooKit @ 1.0.0

ComputeTargetDependencyGraph
note: Building targets in dependency order
note: Target dependency graph (2 targets)
    Target 'App' in project 'App'
        \u279C Explicit dependency on target 'Foo' in project 'Foo'

SwiftDriver App normal arm64 com.apple.xcode.tools.swift.compiler (in target 'App' from project 'App')
    cd /Users/dev/App
    builtin-SwiftDriver -- /toolchain/usr/bin/swiftc -c

/Users/dev/App/Broken.swift:9:3: error: cannot find 'missing' in scope

** BUILD FAILED **
"""
expected = "/Users/dev/App/Broken.swift:9:3: error: cannot find 'missing' in scope\n** BUILD FAILED **"

[[tests.xcodebuild]]
name = "empty input returns on_empty message"
input = ""
expected = "xcodebuild: ok"
