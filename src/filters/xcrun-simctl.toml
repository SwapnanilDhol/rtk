[filters.xcrun-simctl]
description = "Compact xcrun simctl list output — drop shutdown/unavailable devices and SimRuntime catalog lines"
match_command = "^xcrun\\s+simctl\\b"
strip_ansi = true
strip_lines_matching = [
  "^\\s*$",
  ".*\\(Shutdown\\)\\s*$",
  ".*\\(Shutting Down\\)\\s*$",
  ".*\\(unavailable\\)\\s*$",
  ".*\\(Disconnected\\)\\s*$",
  "^iOS \\d+\\.\\d+.*- com\\.apple\\.CoreSimulator\\.SimRuntime\\.",
  "^watchOS \\d+.*- com\\.apple\\.CoreSimulator\\.SimRuntime\\.",
  "^tvOS \\d+.*- com\\.apple\\.CoreSimulator\\.SimRuntime\\.",
  "^visionOS \\d+.*- com\\.apple\\.CoreSimulator\\.SimRuntime\\.",
  "^xrOS \\d+.*- com\\.apple\\.CoreSimulator\\.SimRuntime\\.",
  "^Bridge OS .*- com\\.apple\\.CoreSimulator\\.SimRuntime\\.",
]
head_lines = 20
tail_lines = 45
max_lines = 80
on_empty = "xcrun simctl: ok"

[[tests.xcrun-simctl]]
name = "drops shutdown simulators keeps booted"
input = """
== Devices ==
-- iOS 18.0 --
    iPhone 16 (11111111-1111-1111-1111-111111111111) (Shutdown)
    iPhone 16 Pro (22222222-2222-2222-2222-222222222222) (Booted)
-- iOS 17.4 --
    iPhone 15 (33333333-3333-3333-3333-333333333333) (Shutdown)
"""
expected = """== Devices ==
-- iOS 18.0 --
    iPhone 16 Pro (22222222-2222-2222-2222-222222222222) (Booted)
-- iOS 17.4 --"""

[[tests.xcrun-simctl]]
name = "strips SimRuntime lines from list output"
input = """
== Runtimes ==
iOS 18.2 (18.2 - 22C150) (arm64) - com.apple.CoreSimulator.SimRuntime.iOS-18-2
== Devices ==
-- iOS 18.2 --
    iPhone 16 (aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee) (Booted)
"""
expected = """== Runtimes ==
== Devices ==
-- iOS 18.2 --
    iPhone 16 (aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee) (Booted)"""

[[tests.xcrun-simctl]]
name = "empty input returns on_empty message"
input = ""
expected = "xcrun simctl: ok"
